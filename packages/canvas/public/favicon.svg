<svg width="120" height="120" viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg">
  <title>velloo mark - Design and Code, interlinked</title>
  <defs>
    <clipPath id="vlweave"><rect x="52" y="30" width="38" height="35"/></clipPath>
  </defs>
  <!-- coral frame (Design) -->
  <rect x="21" y="21" width="58" height="58" rx="20" stroke="#FF6F4D" stroke-width="11" stroke-linejoin="round"/>
  <!-- amber frame (Code) - over coral everywhere -->
  <rect x="41" y="41" width="58" height="58" rx="20" stroke="#FFAB1F" stroke-width="11" stroke-linejoin="round"/>
  <!-- redraw coral over amber at the top crossing -> interlink weave (66% overlap) -->
  <rect x="21" y="21" width="58" height="58" rx="20" stroke="#FF6F4D" stroke-width="11" stroke-linejoin="round" clip-path="url(#vlweave)"/>
</svg>
