# CodeQL as a workflow rather than GitHub's default setup: default setup never
# scans pull requests from forks, so the required `Analyze (javascript-typescript)`
# check never reported and an outside contribution could not merge. The job names
# match what default setup produced, so branch protection needs no change. Default
# setup must stay off — code scanning rejects a workflow's upload while it is on.
name: CodeQL

permissions:
  contents: read

on:
  push:
    branches: [main]
  # Not pull_request_target: a fork's code runs here, so it gets the fork's
  # read-only token and no secrets.
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 4 * * 3"

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [actions, javascript-typescript]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: ${{ matrix.language }}
          build-mode: none

      - uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          category: "/language:${{ matrix.language }}"
