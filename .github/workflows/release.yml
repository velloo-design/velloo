# Release: publish `velloo` to npm and attach the tarball to a GitHub release.
#
# Trigger: push a tag `vX.Y.Z` whose version matches
# packages/cli/package.json (see RELEASING.md for the full process).
#
# Required repository secret:
#   NPM_TOKEN — an npm access token (type: Automation, or Granular with
#   read/write on the `velloo` package). Add it under
#   Settings → Secrets and variables → Actions → New repository secret.
#
# `npm publish --provenance` additionally needs the `id-token: write`
# permission below (OIDC attestation) and the `repository` field in the
# published package.json to match this repo — build.ts writes
# github.com/velloo-design/velloo.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write # create the GitHub release
  id-token: write # npm --provenance attestation

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # npm (for `npm publish`) + the registry .npmrc that reads NODE_AUTH_TOKEN.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build shadcn snapshot manifest
        run: bun run build
        working-directory: packages/shadcn-snapshot

      - name: Gates
        run: |
          bun run typecheck
          bun run lint
          bun test

      - name: Tag matches package version
        run: |
          version="$(bun -e 'console.log(require("./packages/cli/package.json").version)')"
          if [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "tag ${GITHUB_REF_NAME} does not match packages/cli version v${version}" >&2
            exit 1
          fi

      # The published binary defaults its opt-in cloud commands to the hosted
      # velloo-cloud; VELLOO_CLOUD_URL / --url still override at runtime.
      - name: Build the publishable bundle
        run: bun packages/cli/build.ts
        env:
          VELLOO_BUILD_CLOUD_URL: https://api.velloo.ai

      - name: Publish to npm
        run: npm publish --provenance --access public
        working-directory: packages/cli/dist
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create the GitHub release with the tarball
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            "velloo-${GITHUB_REF_NAME#v}.tgz" \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
