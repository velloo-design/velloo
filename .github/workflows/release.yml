# Release: publish Velloo, direct archives, and checksums.
#
# Trigger: push a tag `vX.Y.Z` whose version matches
# packages/cli/package.json (see RELEASING.md for the full process).
#
# Required secrets, on the `prod` GitHub environment (dogfood.yml shares it):
#   NPM_TOKEN — a granular npm access token with read/write on `velloo` and
#   bypass 2FA enabled. Prefer npm trusted publishing after the first release.
#   BLOB_ENDPOINT, BLOB_BUCKET, BLOB_ACCESS_KEY, BLOB_SECRET_KEY — the download
#   bucket served by get.velloo.design.
#
# `npm publish --provenance` additionally needs the `id-token: write`
# permission below (OIDC attestation) and the `repository` field in the
# published package.json to match this repo — build.ts writes
# github.com/velloo-design/velloo.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write # create the GitHub release
  id-token: write # npm --provenance attestation

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: prod
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      # npm (for `npm publish`) + the registry .npmrc that reads NODE_AUTH_TOKEN.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Gates
        run: |
          bun run typecheck
          bun run lint
          bun test --parallel

      - name: Tag matches package version
        run: |
          version="$(bun -e 'console.log(require("./packages/cli/package.json").version)')"
          if [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "tag ${GITHUB_REF_NAME} does not match packages/cli version v${version}" >&2
            exit 1
          fi

      - name: Build npm and direct-install artifacts
        run: bun scripts/build-release-artifacts.ts
        env:
          VELLOO_BUILD_CLOUD_URL: https://api.velloo.ai

      - name: Smoke-test npm global install without scripts or Bun on PATH
        run: bun scripts/package-smoke-test.ts

      - name: Smoke-test curl install and checksum rejection
        run: bun scripts/direct-install-smoke-test.ts

      # Put immutable direct artifacts in place before advancing npm `latest`;
      # a direct upgrader that sees the new npm version can then fetch it.
      - name: Publish curl installer and immutable artifacts
        run: bun scripts/publish-cli.ts prod --no-build
        env:
          BLOB_ENDPOINT: ${{ secrets.BLOB_ENDPOINT }}
          BLOB_BUCKET: ${{ secrets.BLOB_BUCKET }}
          BLOB_ACCESS_KEY: ${{ secrets.BLOB_ACCESS_KEY }}
          BLOB_SECRET_KEY: ${{ secrets.BLOB_SECRET_KEY }}

      - name: Publish Velloo to npm
        run: npm publish --provenance --access public
        working-directory: packages/cli/dist
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create the GitHub release
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            release-artifacts/*.tgz \
            release-artifacts/*.tar.gz \
            release-artifacts/*.sha256 \
            release-artifacts/SHA256SUMS \
            release-artifacts/install.sh \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
