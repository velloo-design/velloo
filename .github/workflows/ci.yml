# CI: typecheck + lint + tests on every push/PR, plus the canvas build and the
# browser-backed suites in their own jobs so a slow or flaky dependency can't
# hide a real failure in the fast one.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  # The font catalogue can rot without anyone touching the repo — a family gets
  # renamed or withdrawn upstream and its picker row silently renders as the
  # fallback. Weekly is how that gets noticed.
  schedule:
    - cron: "0 6 * * 1"

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Tests load the snapshot's generated manifest at runtime.
      - name: Build shadcn snapshot manifest
        run: bun run build
        working-directory: packages/shadcn-snapshot

      - name: Typecheck
        run: bun run typecheck

      - name: Lint
        run: bun run lint

      # Dead code is only findable while the report is empty — one unexplained
      # entry and the next reader stops reading it.
      - name: Dead code
        run: bun run lint:dead

      # `typecheck` covers the canvas's TypeScript but never runs Vite, so a
      # broken plugin, a missing asset or a bad import path would surface at
      # release instead of here. Half a second, and it's the SPA we ship.
      - name: Build canvas
        run: bun run build
        working-directory: packages/canvas

      - name: Test
        run: bun test --parallel

  # The Playwright suites, on every push rather than a nightly: they guard the
  # renderer and the canvas mount, and a nightly would report the break hours
  # after the PR that caused it — long enough for a red nightly to become
  # background noise. It's a separate job so a browser download that fails on
  # the network doesn't read as "the test suite is broken", and it costs about
  # a second of testing behind a cached browser.
  e2e:
    name: Browser suites
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build shadcn snapshot manifest
        run: bun run build
        working-directory: packages/shadcn-snapshot

      # Keyed on the pin in packages/renderer/src/screenshot.ts, so bumping
      # Playwright fetches a fresh browser and every other run restores one.
      - name: Resolve the Playwright pin
        id: pw
        run: |
          pin=$(grep -o 'playwright@[0-9.]*' packages/renderer/src/screenshot.ts | head -1)
          echo "pin=$pin" >> "$GITHUB_OUTPUT"

      - name: Cache Chromium
        id: chromium-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: ms-playwright-full-${{ runner.os }}-${{ steps.pw.outputs.pin }}

      # The full build, not the `--only-shell` one `velloo browser install`
      # fetches: the capture-session suite drives a *headed* browser, and the
      # headless shell has no window to open. `install chromium` lays down both,
      # so the headless suites still get the shell they'd use anyway.
      - name: Install Chromium
        if: steps.chromium-cache.outputs.cache-hit != 'true'
        run: bun x ${{ steps.pw.outputs.pin }} install chromium

      # System libraries Chromium links against — including the Xvfb the headed
      # launch needs — and not covered by the browser cache above.
      - name: Install Chromium system dependencies
        run: |
          # ubuntu-latest also configures Google's Chrome apt repository, but
          # Playwright installs its own Chromium build and only needs Ubuntu's
          # system libraries. Ignore that unrelated repository so a transient
          # Chrome metadata mismatch cannot prevent dependency installation.
          sudo rm -f /etc/apt/sources.list.d/google-chrome.list \
            /etc/apt/sources.list.d/google-chrome.sources
          bun x ${{ steps.pw.outputs.pin }} install-deps chromium
          sudo apt-get install -y xvfb

      # Fail loudly rather than letting every suite skip itself back to green —
      # a silent skip is how this job would quietly stop testing anything. Both
      # halves are asserted: a headless binary on disk, and a window that really
      # opens under the virtual display.
      - name: Verify both browsers launch
        run: |
          # JavaScript is intentionally single-quoted.
          # shellcheck disable=SC2016
          xvfb-run -a bun -e '
            const { chromiumExecutable } = await import("./packages/renderer/src/screenshot.ts");
            const path = await chromiumExecutable();
            if (!path) { console.error("no Chromium found — the e2e suites would all skip"); process.exit(1); }
            console.log("chromium:", path);
            // Resolved from the renderer package, not the repo root: playwright-core
            // is its devDep, and a bare specifier here resolves against the cwd.
            const { chromium } = await import(Bun.resolveSync("playwright-core", `${process.cwd()}/packages/renderer`));
            const browser = await chromium.launch({ headless: false });
            console.log("headed:", browser.version());
            await browser.close();
          '

      # Under a virtual display, so the capture-session suite can open a window.
      - name: Test (with browser suites)
        run: xvfb-run -a bun run test:e2e

  # Separate job because it is the one check that needs the network: a Google
  # outage should read as "the font check is red", not fail the suite that was
  # about to tell you something real.
  fonts:
    name: Font catalogue
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Asserts the committed catalogue is what the generator produces, and
      # that every css2 spec in it still resolves.
      - name: Check font catalogue
        run: bun run fonts:check
